name: Daily SARCATSTIC PURRS Reel

on:
  schedule:
    # 11:16 UTC = 4:46 PM IST. Workflow waits until 5:00 PM IST.
    # Minute changed from 15 to 16 to force GitHub to reactivate the schedule.
    - cron: "16 11 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/daily.yml"
  workflow_dispatch:
    inputs:
      day:
        description: "Campaign day (1-30); blank = infer from India date"
        required: false
        type: string
      publish:
        description: "Actually publish to Instagram"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_API_VERSION: v26.0
      DAY_NUMBER: ${{ inputs.day }}
      SHOULD_PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish == true || (github.event_name == 'push' && contains(github.event.head_commit.message, '[manual-publish]')) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m py_compile src/*.py

      - name: Validate Month 1 bank and brand rules
        run: PYTHONPATH=src python src/validate_content.py

      - name: Resolve campaign day
        id: campaign
        shell: bash
        run: |
          DAY=$(PYTHONPATH=src python src/campaign_day.py)
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
          echo "Resolved campaign day: $DAY"

      - name: Stop when today's Reel is already published or bank is empty
        if: steps.campaign.outputs.day == '0'
        run: echo "No publish needed: today's Reel already exists or the approved quote bank is empty."

      - name: Build branded Milo design
        if: steps.campaign.outputs.day != '0'
        run: PYTHONPATH=src python src/generate_post.py --day "${{ steps.campaign.outputs.day }}"

      - name: Build 9:16 Reel with music
        if: steps.campaign.outputs.day != '0'
        run: PYTHONPATH=src python src/build_reel.py --day "${{ steps.campaign.outputs.day }}"

      - name: Build caption
        if: steps.campaign.outputs.day != '0'
        run: PYTHONPATH=src python src/build_caption.py --day "${{ steps.campaign.outputs.day }}"

      - name: Upload preview artifact
        if: steps.campaign.outputs.day != '0'
        uses: actions/upload-artifact@v4
        with:
          name: sarcatstic-reel-day-${{ steps.campaign.outputs.day }}
          path: |
            outputs/day_*.png
            outputs/day_*.mp4
            outputs/day_*_music.json
            outputs/caption.txt

      - name: Copy Reel to public hosting path
        if: steps.campaign.outputs.day != '0' && env.SHOULD_PUBLISH == 'true'
        shell: bash
        env:
          DAY: ${{ steps.campaign.outputs.day }}
        run: |
          DAY_PADDED=$(printf '%02d' "$DAY")
          mkdir -p public
          cp "outputs/day_${DAY_PADDED}.mp4" "public/day_${DAY_PADDED}.mp4"

      - name: Commit public Reel
        if: steps.campaign.outputs.day != '0' && env.SHOULD_PUBLISH == 'true'
        shell: bash
        run: |
          git config user.name "sarcatstic-purrs-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/
          git diff --cached --quiet || git commit -m "Publish Reel asset for campaign day ${{ steps.campaign.outputs.day }}"
          git push

      - name: Wait until 5 PM IST (scheduled runs only)
        if: steps.campaign.outputs.day != '0' && github.event_name == 'schedule'
        run: python src/wait_until_ist.py 17:00

      - name: Publish Reel to Instagram
        if: steps.campaign.outputs.day != '0' && env.SHOULD_PUBLISH == 'true'
        shell: bash
        env:
          DAY: ${{ steps.campaign.outputs.day }}
          CAPTION_FILE: outputs/caption.txt
          RESULT_FILE: published_logs/day_${{ steps.campaign.outputs.day }}.json
        run: |
          DAY_PADDED=$(printf '%02d' "$DAY")
          export VIDEO_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/public/day_${DAY_PADDED}.mp4"
          python src/publish_instagram.py

      - name: Commit publish log
        if: steps.campaign.outputs.day != '0' && env.SHOULD_PUBLISH == 'true'
        shell: bash
        run: |
          git add published_logs/
          git diff --cached --quiet || git commit -m "Log Instagram Reel publish for day ${{ steps.campaign.outputs.day }}"
          git push
